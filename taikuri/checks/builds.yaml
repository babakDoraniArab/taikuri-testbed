id: builds
name: The code must compile
code: 50100
kind: exec
tier: blocking
command: go-build
witness_format: "the first compiler error (file:line) from `go build ./...`"
repair_hint: >-
  Make the code compile. Run `go build ./...` locally and fix every error it
  reports — a missing import, an undefined name, a type mismatch. taikuri runs
  the same command in a clean checkout, so it must pass with no local edits.
