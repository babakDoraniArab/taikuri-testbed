id: no-http-no-tls
name: No plaintext HTTP on a non-localhost bind
code: 20420
kind: semgrep
tier: blocking
# scope omitted (see hardcoded-secret.yaml): the rule file pins languages:[go].
impl: rules/no-http-no-tls.semgrep.yaml
witness_format: "file:line of the http.ListenAndServe call with a non-loopback literal bind"
repair_hint: >-
  Serve TLS: use http.ListenAndServeTLS with a certificate and key, or terminate
  TLS at a trusted reverse proxy and keep the Go server bound to 127.0.0.1. Only
  loopback (127.0.0.1 / localhost) binds may serve plaintext HTTP.
