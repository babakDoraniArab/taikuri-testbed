id: no-exec-user-input
name: No exec with a non-literal program name
code: 20310
kind: semgrep
tier: blocking
# scope omitted (see hardcoded-secret.yaml): the rule file pins languages:[go].
impl: rules/no-exec-user-input.semgrep.yaml
witness_format: "file:line of the exec.Command call with a non-literal first argument"
repair_hint: >-
  Pass a fixed, literal program name to exec.Command and supply user-controlled
  data only as separate arguments (exec.Command("git", "clone", url)). Never let
  the program name come from a variable — validate/allowlist it if it truly must vary.
