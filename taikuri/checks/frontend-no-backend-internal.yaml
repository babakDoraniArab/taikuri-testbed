id: frontend-no-backend-internal
name: Frontend must not import backend internals
kind: map-edge
tier: blocking
forbid:
  from: "frontend/..."
  to: "internal/..."
  # only_new: false — forbid the edge outright, whether pre-existing or added by
  # the PR. A frontend package reaching into backend internals is never allowed,
  # so the whole-map check (not just newly-added edges) is the correct posture.
  only_new: false
witness_format: "file:line of the import statement in the frontend package that reaches internal/"
repair_hint: >-
  The frontend must not import backend-internal packages directly. Call the
  backend through its public HTTP API (or a shared, exported client package),
  never by importing code under internal/.
