id: no-raw-sql
name: No raw SQL built from strings
code: 20530
kind: semgrep
tier: blocking
# scope omitted (see hardcoded-secret.yaml): the rule file pins languages:[go],
# which is the correct targeting; the engine scope filter cannot express `**`.
impl: rules/no-raw-sql.semgrep.yaml
witness_format: "file:line of the concatenation / fmt.Sprintf that builds the SQL"
repair_hint: >-
  Do not build SQL by string concatenation or fmt.Sprintf. Use a parameterized
  query — pass values as query arguments (db.Query("SELECT ... WHERE id = $1", id))
  so the driver escapes them and SQL injection is impossible.
