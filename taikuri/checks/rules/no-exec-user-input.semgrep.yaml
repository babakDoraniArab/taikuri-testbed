# security-starter / no-exec-user-input
#
# Go: flags os/exec.Command whose program (first) argument is NOT a string
# literal. A non-literal program name is how user input reaches a shell/exec,
# the command-injection shape. Literal-command calls (the safe, common case)
# are explicitly excluded, keeping false positives near zero.
#
# Pinned-version note: validated on semgrep 1.152.0 (local) and 1.184.0 (Docker).
rules:
  - id: no-exec-user-input
    patterns:
      - pattern-either:
          - pattern: exec.Command($CMD, ...)
          - pattern: exec.CommandContext($CTX, $CMD, ...)
          - pattern: syscall.Exec($CMD, ...)
      # Exclude the safe case: a string-literal program name.
      - pattern-not: exec.Command("...", ...)
      - pattern-not: exec.CommandContext($CTX, "...", ...)
      - pattern-not: syscall.Exec("...", ...)
    message: >-
      exec.Command is called with a non-literal program name. Deriving the
      executed program from a variable is the command-injection shape — pass a
      fixed program name and supply user input only as separate, validated
      arguments.
    languages: [go]
    severity: ERROR

  # Shell-wrapped non-literal payloads: a literal program name does not make
  # `sh -c <variable>` safe — the payload IS the command line (security review
  # 2026-11-14 #2).
  - id: no-exec-user-input-shell
    patterns:
      - pattern-either:
          - pattern: exec.Command("sh", "-c", $X, ...)
          - pattern: exec.Command("bash", "-c", $X, ...)
          - pattern: exec.CommandContext($CTX, "sh", "-c", $X, ...)
          - pattern: exec.CommandContext($CTX, "bash", "-c", $X, ...)
      - pattern-not: exec.Command("sh", "-c", "...", ...)
      - pattern-not: exec.Command("bash", "-c", "...", ...)
      - pattern-not: exec.CommandContext($CTX, "sh", "-c", "...", ...)
      - pattern-not: exec.CommandContext($CTX, "bash", "-c", "...", ...)
    message: >-
      Shell invocation with a non-literal command string — the payload is the
      command line, so this is command injection regardless of the literal
      "sh". Avoid the shell; exec the target program directly with separate
      arguments.
    languages: [go]
    severity: ERROR
