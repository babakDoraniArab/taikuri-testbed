# security-starter / no-http-no-tls
#
# Go: flags http.ListenAndServe (plaintext, no TLS) bound to a string-literal
# address that is NOT loopback. Serving plaintext HTTP on a non-localhost bind
# exposes unencrypted traffic on the network. Deliberately low-FP: a variable
# bind address is left alone (we cannot know its value), and 127.0.0.1 /
# localhost binds (dev servers) are allowed.
#
# Pinned-version note: validated on semgrep 1.152.0 (local) and 1.184.0 (Docker).
rules:
  - id: no-http-no-tls
    patterns:
      - pattern: http.ListenAndServe($ADDR, $H)
      # Only consider string-literal binds...
      - metavariable-pattern:
          metavariable: $ADDR
          pattern: '"..."'
      # ...that are not loopback (localhost / 127.0.0.1). metavariable-regex
      # matches the literal's source text, so the leading quote is required —
      # this anchors the loopback lookahead to the start of the address value.
      - metavariable-regex:
          metavariable: $ADDR
          regex: '^"(?!127\.0\.0\.1)(?!localhost)'
    message: >-
      http.ListenAndServe serves plaintext HTTP on a non-localhost address.
      Use http.ListenAndServeTLS with a certificate, or terminate TLS at a
      trusted proxy; bind to 127.0.0.1/localhost only for local development.
    languages: [go]
    severity: ERROR
