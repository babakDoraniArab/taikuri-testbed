# security-starter / no-raw-sql
#
# Go: flags SQL statements assembled by string concatenation or fmt.Sprintf,
# the classic SQL-injection shape. The AST patterns ignore comments and only
# fire when a SQL-keyword string literal meets a dynamic value, so the planted
# VIOLATION-SITE *comment* in the testbed does not trip it.
#
# Pinned-version note: validated on semgrep 1.152.0 (local) and 1.184.0 (Docker).
rules:
  - id: no-raw-sql
    patterns:
      - pattern-either:
          # "SELECT ... " + someVar   (SQL literal on either side of a concat)
          - pattern: $SQL + $X
          - pattern: $X + $SQL
          # fmt.Sprintf("SELECT ... %s", arg)
          - pattern: fmt.Sprintf($SQL, ...)
      # $SQL must be a string literal...
      - metavariable-pattern:
          metavariable: $SQL
          pattern: '"..."'
      # ...that opens with a SQL verb.
      - metavariable-regex:
          metavariable: $SQL
          regex: '(?i)^"?\s*(SELECT|INSERT|UPDATE|DELETE)\s'
    message: >-
      SQL statement built by string concatenation / fmt.Sprintf. This is the
      classic SQL-injection shape — use parameterized queries ($1, ? or named
      parameters) and pass values as query arguments instead.
    languages: [go]
    severity: ERROR
